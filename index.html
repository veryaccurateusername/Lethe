<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lethe wakes up in…</title>
<style>
:root{--bg:#0e0b1a;--card:#1a1530;--line:#30285a;--text:#ece8ff;--muted:#9a93c4;--accent:#a78bfa;--gold:#fbbf24;--glow:rgba(167,139,250,.35);--lethe:#a56bf0;--h1a:#f0abfc;--h1b:#c4b5fd;--h1c:#93c5fd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f1ff;--card:#fff;--line:#d9d0ff;--text:#241a4d;--muted:#6b629a;--accent:#6d4aed;--gold:#b7790b;--glow:rgba(109,74,237,.2);--lethe:#7c3fd6;--h1a:#a21caf;--h1b:#6d28d9;--h1c:#1d4ed8}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(rgba(14,11,26,.35),rgba(14,11,26,.35)),url(assets/background.webp) center/cover fixed no-repeat,var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
main{width:100%;max-width:760px}
h1{margin:.2em 0 .1em;font-size:clamp(1.8rem,6vw,2.8rem)}
.hero{display:block;width:min(560px,100%);height:auto;margin:0 auto 8px}
h1,.sub{text-align:center}
h1{background:linear-gradient(90deg,var(--h1a),var(--h1b),var(--h1c));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 14px rgba(168,85,247,.45))}
.sub{color:var(--muted);margin:0 0 1.5rem}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cell{background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06));-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.28);border-radius:22px;padding:20px 8px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08)}
.num{font-size:clamp(2rem,10vw,3.6rem);font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold)}
.lbl{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em}
.done{display:none;text-align:center;font-size:clamp(1.6rem,6vw,2.4rem);color:var(--gold);padding:30px 0}
body.ended .grid{display:none}
body.ended .done{display:block}
</style>
</head>
<body>
<main>
  <video class="hero" autoplay loop muted playsinline preload="auto" aria-label="Lethe" poster="assets/hero-lethe.webp"><source src="assets/hero-lethe-anim.webm" type="video/webm"></video>
  <h1>Lethe wakes up in:</h1>
  <p class="sub">11 November 2026 · 1:00 PM Pacific</p>

  <div class="grid" role="timer" aria-live="off">
    <div class="cell"><div class="num" id="d">0</div><div class="lbl">Days</div></div>
    <div class="cell"><div class="num" id="h">00</div><div class="lbl">Hours</div></div>
    <div class="cell"><div class="num" id="m">00</div><div class="lbl">Minutes</div></div>
    <div class="cell"><div class="num" id="s">00</div><div class="lbl">Seconds</div></div>
  </div>
  <div class="done">It’s time!</div>
</main>
<script>
const TARGET = Date.parse("2026-11-11T13:00:00-08:00");
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
function tick(){
  const now = Date.now(), diff = TARGET - now;
  if (diff <= 0){ document.body.classList.add("ended"); return; }
  const t = Math.floor(diff/1000);
  $("d").textContent = Math.floor(t/86400);
  $("h").textContent = pad(Math.floor(t%86400/3600));
  $("m").textContent = pad(Math.floor(t%3600/60));
  $("s").textContent = pad(t%60);
}
tick(); setInterval(tick, 250);
</script>
</body>
</html>
