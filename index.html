<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lethe wakes up in…</title>
<style>
:root{--bg:#0e0b1a;--card:#1a1530;--line:#30285a;--text:#ece8ff;--muted:#9a93c4;--accent:#a78bfa;--gold:#fbbf24;--glow:rgba(167,139,250,.35);--lethe:#a56bf0;--h1a:#f0abfc;--h1b:#c4b5fd;--h1c:#93c5fd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f1ff;--card:#fff;--line:#d9d0ff;--text:#241a4d;--muted:#6b629a;--accent:#6d4aed;--gold:#b7790b;--glow:rgba(109,74,237,.2);--lethe:#7c3fd6;--h1a:#a21caf;--h1b:#6d28d9;--h1c:#1d4ed8}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(rgba(14,11,26,.35),rgba(14,11,26,.35)),url(background.webp) center/cover fixed no-repeat,var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
main{width:100%;max-width:760px;position:relative;z-index:1}
.bg2{position:fixed;inset:0;z-index:0;background:linear-gradient(rgba(14,11,26,.25),rgba(14,11,26,.25)),url(background-2.webp) center/cover no-repeat;opacity:0;transition:opacity 1.4s ease;pointer-events:none}
body.ended .bg2{opacity:1}
body.instant .bg2{transition:none}
h1{margin:.2em 0 .1em;font-size:clamp(1.8rem,6vw,2.8rem)}
.hero{display:block;width:min(560px,100%);height:auto;margin:0 auto 8px}
h1,.sub{text-align:center}
h1{background:linear-gradient(90deg,var(--h1a),var(--h1b),var(--h1c));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 14px rgba(168,85,247,.45))}
.sub{color:var(--muted);margin:0 0 1.5rem}
.grid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cell{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06));-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.28);border-radius:22px;padding:20px 8px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08)}
.num,.lbl{position:relative;z-index:2}
.cell.broken{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-color:transparent;box-shadow:none}
.cell.broken .num,.cell.broken .lbl{visibility:hidden}
.shards{position:absolute;inset:-1px;z-index:3;pointer-events:none}
.shard{position:absolute;inset:0;border-radius:22px;border:1px solid rgba(255,255,255,.32);padding:20px 8px;text-align:center;will-change:transform,opacity}
.shard .num,.shard .lbl{position:relative}
.crack{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;overflow:visible}
body.breaking{overflow:hidden}
.num{font-size:clamp(2rem,10vw,3.6rem);font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold)}
.lbl{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em}
</style>
</head>
<body>
<div class="bg2" aria-hidden="true"></div>
<main>
  <video class="hero" autoplay loop muted playsinline preload="auto" aria-label="Lethe" poster="hero-lethe.webp"><source src="hero-lethe-anim.webm" type="video/webm"></video>
  <h1 id="title">Lethe wakes up in:</h1>
  <p class="sub">11 November 2026 · 1:00 PM Pacific</p>

  <div class="grid" role="timer" aria-live="off">
    <div class="cell"><div class="num" id="d">0</div><div class="lbl">Days</div></div>
    <div class="cell"><div class="num" id="h">00</div><div class="lbl">Hours</div></div>
    <div class="cell"><div class="num" id="m">00</div><div class="lbl">Minutes</div></div>
    <div class="cell"><div class="num" id="s">00</div><div class="lbl">Seconds</div></div>
  </div>
</main>
<script>
// Add ?test to the URL (index.html?test) to preview the ending in ~8 seconds.
const TEST = /[?&]test\b/.test(location.search);
const TARGET = TEST ? Date.now() + 8000 : Date.parse("2026-11-11T13:00:00-08:00");
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const NS = "http://www.w3.org/2000/svg";
let started = false, ended = false;

// One crack from the bottom-left of the first box to the top-right of the last box.
function crack(grid){
  const W = grid.offsetWidth, H = grid.offsetHeight, L = Math.hypot(W, H);
  const nx = H/L, ny = W/L;
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "crack");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.style.filter = "drop-shadow(0 0 5px #e9d5ff) drop-shadow(0 0 16px #a855f7)";
  const N = 16, pts = [];
  for (let i = 0; i <= N; i++){
    const t = i/N, j = (i === 0 || i === N) ? 0 : (Math.random()-.5)*28;
    pts.push([t*W + j*nx, H - t*H + j*ny]);
  }
  const mk = (d, w, o) => { const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d); p.setAttribute("fill", "none"); p.setAttribute("stroke", "#fff");
    p.setAttribute("stroke-width", w); p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round"); p.setAttribute("opacity", o); svg.appendChild(p); return p; };
  const main = mk("M" + pts.map(p => p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L"), 3, 1);
  for (let k = 0; k < 6; k++){
    const i = 2 + Math.floor(Math.random()*(N-3)), a = pts[i], dir = Math.random() < .5 ? 1 : -1;
    const len = 25 + Math.random()*55, bx = a[0] + dir*nx*len + (Math.random()-.5)*20, by = a[1] + dir*ny*len + (Math.random()-.5)*20;
    mk("M" + a[0].toFixed(1)+","+a[1].toFixed(1) + " L" + ((a[0]+bx)/2+(Math.random()-.5)*10).toFixed(1)+","+((a[1]+by)/2+(Math.random()-.5)*10).toFixed(1) + " L" + bx.toFixed(1)+","+by.toFixed(1), 1.6, .8);
  }
  grid.appendChild(svg);
  const len = main.getTotalLength();
  main.style.strokeDasharray = len;
  main.animate([{strokeDashoffset: len}, {strokeDashoffset: 0}], {duration: 220, easing: "ease-in", fill: "forwards"});
  return svg;
}

function shatter(cell, W, H){
  const L = Math.hypot(W, H), nx = H/L, ny = W/L;
  const ox = cell.offsetLeft, oy = cell.offsetTop, cw = cell.offsetWidth, ch = cell.offsetHeight;
  const box = document.createElement("div");
  box.className = "shards";
  const C = 5, R = 4, pts = [];
  for (let r = 0; r <= R; r++){ pts.push([]);
    for (let c = 0; c <= C; c++){
      const eX = c === 0 || c === C, eY = r === 0 || r === R;
      pts[r].push([c/C*100 + (eX ? 0 : (Math.random()-.5)*13), r/R*100 + (eY ? 0 : (Math.random()-.5)*22)]);
    }
  }
  const tris = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++){
    const a = pts[r][c], b = pts[r][c+1], d = pts[r+1][c], e = pts[r+1][c+1];
    if (Math.random() < .5){ tris.push([a,b,e]); tris.push([a,e,d]); }
    else { tris.push([a,b,d]); tris.push([b,e,d]); }
  }
  const content = Array.from(cell.children).map(n => { const c = n.cloneNode(true); c.removeAttribute("id"); return c; });
  const anims = [];
  tris.forEach(t => {
    const el = document.createElement("div");
    el.className = "shard";
    content.forEach(c => el.appendChild(c.cloneNode(true)));
    const cx = (t[0][0]+t[1][0]+t[2][0])/3, cy = (t[0][1]+t[1][1]+t[2][1])/3;
    el.style.clipPath = "polygon(" + t.map(p => p[0].toFixed(1)+"% "+p[1].toFixed(1)+"%").join(",") + ")";
    el.style.transformOrigin = cx.toFixed(1)+"% "+cy.toFixed(1)+"%";
    el.style.background = "linear-gradient(" + Math.floor(Math.random()*360) + "deg,rgba(255,255,255,.42),rgba(255,255,255,.1) 60%,rgba(190,150,255,.28))";
    box.appendChild(el);
    const gx = ox + cx/100*cw, gy = oy + cy/100*ch;
    const u = (gx*W + (H-gy)*H) / (W*W + H*H);
    const sd = (gx*H + (gy-H)*W) / L, sign = sd < 0 ? -1 : 1;
    const lat = sign * (24 + Math.random()*70) * (.5 + Math.min(Math.abs(sd)/(L/2), 1));
    const dx = nx*lat + (Math.random()-.5)*30, dy = ny*lat*.5;
    const g = 260 + Math.random()*280, rot = (Math.random()-.5)*300;
    anims.push(el.animate([
      {transform: "translate(0,0) rotate(0deg)", opacity: 1, offset: 0, easing: "cubic-bezier(.1,.8,.3,1)"},
      {transform: "translate("+dx+"px,"+dy+"px) rotate("+(rot*.3)+"deg)", opacity: 1, offset: .3, easing: "cubic-bezier(.5,0,.9,.7)"},
      {transform: "translate("+(dx*1.3)+"px,"+(dy+g)+"px) rotate("+rot+"deg) scale(.8)", opacity: 0, offset: 1}
    ], {duration: 1200 + Math.random()*600, delay: u*90 + Math.random()*40, fill: "forwards"}));
  });
  cell.appendChild(box);
  cell.classList.add("broken");
  return Promise.all(anims.map(a => a.finished.catch(() => 0))).then(() => box.remove());
}

function removeHero(grid){
  const v = document.querySelector(".hero");
  if (!v) return;
  v.pause();
  const h = v.getBoundingClientRect().height, m = parseFloat(getComputedStyle(v).marginBottom) || 0, DUR = 900;
  const opt = {duration: DUR, easing: "ease", fill: "forwards"};
  // The heading rises as the animation folds away; the boxes get an equal counter-shift so they stay put.
  grid.animate([{transform: "translateY(0)"}, {transform: "translateY(" + h + "px)"}], opt);
  v.animate([{opacity: 1, height: h+"px", marginBottom: m+"px"}, {opacity: 0, height: "0px", marginBottom: "0px"}], opt)
    .finished.then(() => v.remove()).catch(() => v.remove());
}

function finish(animated){
  const grid = document.querySelector(".grid");
  document.body.classList.add("ended");
  if (!animated || reduce) document.body.classList.add("instant");
  $("title").textContent = "Her Majesty is back.";
  document.title = "Her Majesty is back.";
  ["d","h","m","s"].forEach(id => $(id).textContent = id === "d" ? "0" : "00");
  if (!animated || reduce){
    const v = document.querySelector(".hero"); if (v) v.remove();
    grid.style.display = "none"; return;
  }
  // Everything starts together: heading rises, background fades in, crack runs, boxes shatter.
  document.body.classList.add("breaking");
  const W = grid.offsetWidth, H = grid.offsetHeight;
  removeHero(grid);
  const svg = crack(grid);
  setTimeout(() => {
    const jobs = Array.from(grid.querySelectorAll(".cell")).map(c => shatter(c, W, H));
    svg.animate([{opacity: 1}, {opacity: 0}], {duration: 450, fill: "forwards"}).finished.then(() => svg.remove());
    Promise.all(jobs).then(() => { grid.style.display = "none"; document.body.classList.remove("breaking"); });
  }, 230);
}

function tick(){
  const diff = TARGET - Date.now();
  if (diff <= 0){ if (!ended){ ended = true; finish(started); } return; }
  started = true;
  const t = Math.floor(diff/1000);
  $("d").textContent = Math.floor(t/86400);
  $("h").textContent = pad(Math.floor(t%86400/3600));
  $("m").textContent = pad(Math.floor(t%3600/60));
  $("s").textContent = pad(t%60);
}
tick(); setInterval(tick, 250);
</script>
</body>
</html>
